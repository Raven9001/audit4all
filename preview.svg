<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Example AUDIT4ALL result" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" rx="14" fill="#232a2e" stroke="#101417"/>
  <rect width="900" height="38" rx="14" fill="#2f383e"/>
  <rect y="24" width="900" height="14" fill="#2f383e"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8e9ca6">AUDIT4ALL - example result</text>
  <!-- metrics -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="30" y="62" width="260" height="70" rx="3" fill="#2b343a" stroke="#101417"/>
    <text x="46" y="86" font-size="11" fill="#8e9ca6" letter-spacing="1.2">CHECKED</text>
    <text x="46" y="116" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#d6dee3">22</text>
    <rect x="320" y="62" width="260" height="70" rx="3" fill="#2b343a" stroke="#101417"/>
    <text x="336" y="86" font-size="11" fill="#8e9ca6" letter-spacing="1.2">TO LOOK AT</text>
    <text x="336" y="116" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#ff9d1c">1</text>
    <rect x="610" y="62" width="260" height="70" rx="3" fill="#2b343a" stroke="#101417"/>
    <text x="626" y="86" font-size="11" fill="#8e9ca6" letter-spacing="1.2">NORMAL</text>
    <text x="626" y="116" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#d6dee3">21</text>
  </g>
  <!-- banner -->
  <rect x="30" y="152" width="840" height="40" rx="3" fill="#3b3320"/>
  <rect x="30" y="152" width="4" height="40" fill="#ff9d1c"/>
  <text x="50" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffd699">One thing to look at. It's probably fine. Here's how to check.</text>
  <!-- card -->
  <rect x="30" y="210" width="840" height="162" rx="3" fill="#2b343a" stroke="#101417"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d6dee3">
    <text x="50" y="240" font-weight="700" fill="#ff9d1c">Development web server</text>
    <text x="50" y="272"><tspan font-weight="700">What's happening:</tspan> A program is running a development web server on port 8000.</text>
    <text x="50" y="302"><tspan font-weight="700">Why it matters:</tspan> Test servers often have no password and show private project data.</text>
    <text x="50" y="332"><tspan font-weight="700">What to do:</tspan> Stop the dev server when you are done.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
